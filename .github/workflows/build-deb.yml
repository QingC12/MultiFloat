name: build-deb

# 目标环境：[CONFIRMED] iPhone 15 Pro Max / iOS 17.3.1 / arm64e / roothide (Relaxin)
#
# 关键设计（均已由本地排查/证据确定，勿随意回退）：
#   - 打包方案 roothide + ARCHS=arm64e，control Architecture=iphoneos-arm64e
#   - 必须用 roothide/theos（上游 theos/theos 不支持 THEOS_PACKAGE_SCHEME=roothide）
#   - 必须装可用的 ldid：v0.1.x 曾产出 ident=.unsigned / flags=0 的占位签名，
#     在 roothide 上会因 CoreTrust 校验失败导致 SpringBoard 崩溃进安全模式
#   - SDK 用 runner 自带 Xcode 的 iPhoneOS SDK（theos/sdks 公开最高仅 16.5）
#   - 构建后用 scripts/verify_deb.py 强校验架构/布局/签名，不通过即失败

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS_PACKAGE_SCHEME: roothide

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (roothide fork)
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          ls "$THEOS/lib/iphone" || true

      - name: Provide iOS SDK
        run: |
          set -euo pipefail
          SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDKVER="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Xcode iPhoneOS SDK: $SDKPATH (version $SDKVER)"
          mkdir -p "$THEOS/sdks"
          ln -sfn "$SDKPATH" "$THEOS/sdks/iPhoneOS${SDKVER}.sdk"
          curl -fL -o /tmp/sdk16.tar.xz \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            && tar -xJf /tmp/sdk16.tar.xz -C "$THEOS/sdks" || true
          ls -l "$THEOS/sdks"
          echo "MF_SDK_VERSION=$SDKVER" >> "$GITHUB_ENV"

      - name: Install packaging + signing tools
        run: |
          set -euo pipefail
          brew install dpkg || true
          # 关键：安装可用的 ldid（Procursus 版），否则 Theos 只能产出占位签名
          curl -fL -o /tmp/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          which ldid
          ldid -v || true

      - name: Toolchain info
        run: |
          echo "THEOS=${THEOS}"
          echo "MF_SDK_VERSION=${MF_SDK_VERSION}"
          echo "THEOS_PACKAGE_SCHEME=${THEOS_PACKAGE_SCHEME}"
          xcodebuild -version || true
          clang --version | head -2 || true

      - name: Build MultiFloat package
        run: make package

      - name: Build MultiFloatProbe package
        run: make package -C Probe

      - name: List packages
        if: always()
        run: |
          ls -l packages || true
          ls -l Probe/packages || true

      - name: Verify DEB (arch / roothide layout / ad-hoc signature)
        run: python3 scripts/verify_deb.py packages/*.deb Probe/packages/*.deb

      - name: Upload MultiFloat DEB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MultiFloat-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload MultiFloatProbe DEB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MultiFloatProbe-deb
          path: Probe/packages/*.deb
          if-no-files-found: error
